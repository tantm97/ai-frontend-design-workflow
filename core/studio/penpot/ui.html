<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dfw bridge</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #18181b; --muted: #52525b; --line: #e4e4e7; --accent: #2563eb; --on-accent: #ffffff; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --ink: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --accent: #60a5fa; --on-accent: #0b1220; --err: #fca5a5; } }
  body { margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: var(--muted); }
  section { border-top: 1px solid var(--line); padding: 10px 0; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; gap: 6px; align-items: center; margin: 6px 0; color: var(--muted); }
  input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, monospace; margin: 8px 0 0; max-height: 180px; overflow: auto; }
  .err { color: var(--err); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<h1>dfw bridge</h1>
<p>Penpot is a view of the dfw design: changes come back as dfw comments, never as direct edits.</p>
<section>
  <label for="page">dfw page id (empty = all)</label>
  <input id="page" type="text" placeholder="e.g. inventory">
  <label for="bp">Breakpoints (empty = all)</label>
  <input id="bp" type="text" placeholder="e.g. desktop,mobile">
  <label><input id="refresh" type="checkbox" checked> Render now (else use the last "dfw penpot export")</label>
  <label><input id="components" type="checkbox" checked> Component masters as Penpot components</label>
  <div class="row">
    <button id="build" class="primary" type="button">Build boards</button>
    <button id="load" type="button">Load export file</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</section>
<section>
  <div class="row">
    <button id="send" class="primary" type="button">Send changes to dfw</button>
    <button id="download" type="button">Download changes</button>
  </div>
</section>
<pre id="log" aria-live="polite"></pre>
<script>
  const log = (t, err) => {
    const el = document.getElementById('log');
    el.textContent = t;
    el.className = err ? 'err' : '';
  };
  const toPlugin = (msg) => parent.postMessage(msg, '*');
  let downloadOnly = false;

  async function images(doc) {
    const srcs = new Set();
    const visit = (l) => {
      if (l.kind === 'image' && l.src) srcs.add(l.src);
      (l.children || []).forEach(visit);
    };
    doc.pages.forEach((p) => p.boards.forEach((b) => b.layers.forEach(visit)));
    doc.components.forEach((c) => visit(c.root));
    const out = {};
    for (const src of srcs) {
      try {
        const r = await fetch(src);
        if (r.ok) out[src] = { data: new Uint8Array(await r.arrayBuffer()), type: r.headers.get('content-type') || 'image/png' };
      } catch (e) {}
    }
    return out;
  }

  async function build(doc) {
    log(`Building ${doc.pages.length} page(s)...`);
    toPlugin({ type: 'build', export: doc, images: await images(doc), options: { components: document.getElementById('components').checked } });
  }

  document.getElementById('build').addEventListener('click', async () => {
    const q = new URLSearchParams();
    if (document.getElementById('refresh').checked) q.set('refresh', '1');
    const page = document.getElementById('page').value.trim();
    const bp = document.getElementById('bp').value.trim();
    if (page) q.set('page', page);
    if (bp) q.set('bp', bp);
    log('Rendering the dfw design in the Studio...');
    try {
      const r = await fetch(`/__dfw/penpot/export.json?${q}`);
      const doc = await r.json();
      if (!r.ok) throw new Error(doc.error || r.statusText);
      await build(doc);
    } catch (e) {
      log(`Could not get the export: ${e.message}. Is the dfw Studio running? Or use "Load export file".`, true);
    }
  });
  document.getElementById('load').addEventListener('click', () => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) await build(JSON.parse(await f.text()));
  });
  document.getElementById('send').addEventListener('click', () => {
    downloadOnly = false;
    log('Collecting changes...');
    toPlugin({ type: 'collect' });
  });
  document.getElementById('download').addEventListener('click', () => {
    downloadOnly = true;
    log('Collecting changes...');
    toPlugin({ type: 'collect' });
  });

  window.addEventListener('message', async (e) => {
    const msg = e.data || {};
    if (msg.type === 'error') return log(msg.message, true);
    if (msg.type === 'built') {
      const s = msg.stats;
      return log(`Built ${s.pages} page(s), ${s.boards} board(s), ${s.layers} layer(s), ${s.components} component(s), ${s.instances} instance(s), ${s.tokenLinks} token link(s).${s.warnings.length ? `\n\n${s.warnings.slice(0, 20).join('\n')}` : ''}`);
    }
    if (msg.type === 'changes') {
      const json = JSON.stringify(msg.data, null, 2);
      if (downloadOnly) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = `dfw-penpot-changes-${Date.now()}.json`;
        a.click();
        return log('Downloaded. Import it with: dfw penpot import <file>');
      }
      try {
        const r = await fetch('/__dfw/penpot/changes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: json });
        const res = await r.json();
        if (!r.ok) throw new Error(res.error || r.statusText);
        log(res.summary);
      } catch (err) {
        log(`Could not send: ${err.message}. Use "Download changes" and run "dfw penpot import <file>".`, true);
      }
    }
  });
</script>
</body>
</html>
