<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dfw bridge</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #18181b; --muted: #52525b; --line: #e4e4e7; --accent: #2563eb; --on-accent: #ffffff; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --ink: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --accent: #60a5fa; --on-accent: #0b1220; --err: #fca5a5; } }
  body { margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: var(--muted); }
  section { border-top: 1px solid var(--line); padding: 10px 0; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; gap: 6px; align-items: center; margin: 6px 0; color: var(--muted); }
  input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, monospace; margin: 8px 0 0; max-height: 180px; overflow: auto; }
  .err { color: var(--err); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<h1>dfw bridge</h1>
<p>Penpot is a view of the dfw design: changes come back as dfw comments, never as direct edits.</p>
<section>
  <label for="page">dfw page id (empty = all)</label>
  <input id="page" type="text" placeholder="e.g. inventory">
  <label for="bp">Breakpoints (empty = all)</label>
  <input id="bp" type="text" placeholder="e.g. desktop,mobile">
  <label><input id="refresh" type="checkbox" checked> Render now (else use the last "dfw penpot export")</label>
  <label><input id="components" type="checkbox" checked> Component masters as Penpot components</label>
  <div class="row">
    <button id="build" class="primary" type="button">Build boards</button>
    <button id="update" type="button">Update boards</button>
    <button id="load" type="button">Load export file</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</section>
<section>
  <label><input id="live" type="checkbox" checked> Live comments: threads on dfw boards go to the AI, its replies come back into the thread</label>
  <label><input id="auto" type="checkbox"> Keep boards up to date automatically (your changes are sent to dfw first)</label>
  <p id="liveStatus" aria-live="polite">Waiting for the first check...</p>
  <p id="agent" aria-live="polite" hidden></p>
  <p id="autoStatus" aria-live="polite" hidden></p>
  <p id="stale" hidden>The dfw design changed since these boards were built: press <b>Update boards</b>.</p>
</section>
<section>
  <div class="row">
    <button id="send" class="primary" type="button">Send changes to dfw</button>
    <button id="download" type="button">Download changes</button>
  </div>
</section>
<pre id="log" aria-live="polite"></pre>
<script src="/__dfw/penpot/ui.js"></script>
<script>
  /* global dfwPanel */
  const log = (t, err) => {
    const el = document.getElementById('log');
    el.textContent = t;
    el.className = err ? 'err' : '';
  };
  const say = (id, t) => {
    const el = document.getElementById(id);
    el.textContent = t || '';
    el.hidden = !t;
  };
  // "Keep boards up to date automatically": what the user chose last in this browser, else on
  // when the project reviews in Penpot (review.canvas).
  const AUTO_KEY = 'dfw.penpot.autoUpdate';
  const autoBox = document.getElementById('auto');
  const stored = () => {
    try {
      return localStorage.getItem(AUTO_KEY);
    } catch (e) {
      return null;
    }
  };
  autoBox.addEventListener('change', () => {
    try {
      localStorage.setItem(AUTO_KEY, autoBox.checked ? '1' : '0');
    } catch (e) {}
    if (!autoBox.checked) say('autoStatus', '');
  });
  // The Studio says which Penpot origins this panel talks to (penpot.origins of the user's dfw
  // config) and gives the token its writes carry: a page that is not this panel cannot read it.
  // A restarted Studio has a new token: after a refused write or a lost Studio the next tick reads
  // the session again (the origins of the last good one still check Penpot's messages meanwhile).
  let bridge = null;
  let needSession = true;
  async function loadSession() {
    try {
      const r = await fetch('/__dfw/penpot/session.json');
      if (!r.ok) throw new Error(r.statusText || String(r.status));
      const first = !bridge;
      bridge = await r.json();
      needSession = false;
      if (first) autoBox.checked = dfwPanel.autoDefault(stored(), bridge.canvas);
      else log('Connected to the dfw Studio again.');
      return true;
    } catch (e) {
      log(`Could not reach the dfw Studio: ${e.message}. Is it running ("dfw studio start")?`, true);
      return false;
    }
  }
  // Only to Penpot: the frame's own Penpot when the browser tells it, else each allowed origin
  // (a message to an origin that is not the parent's is dropped by the browser).
  const penpotOrigins = () => {
    if (!bridge) return [];
    const top = window.location.ancestorOrigins && window.location.ancestorOrigins[0];
    return bridge.origins.includes(top) ? [top] : bridge.origins;
  };
  const toPlugin = (msg) => penpotOrigins().forEach((o) => parent.postMessage(msg, o));
  const post = async (url, body) => {
    let r;
    try {
      r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-dfw-bridge': bridge ? bridge.token : '' }, body });
    } catch (e) {
      needSession = true;
      throw e;
    }
    if (dfwPanel.needsSession(r.status)) needSession = true;
    return r;
  };
  let downloadOnly = false;

  async function images(doc) {
    const srcs = new Set();
    const visit = (l) => {
      if (l.kind === 'image' && l.src) srcs.add(l.src);
      (l.children || []).forEach(visit);
    };
    doc.pages.forEach((p) => p.boards.forEach((b) => b.layers.forEach(visit)));
    doc.components.forEach((c) => visit(c.root));
    const out = {};
    for (const src of srcs) {
      try {
        const r = await fetch(src);
        if (r.ok) out[src] = { data: new Uint8Array(await r.arrayBuffer()), type: r.headers.get('content-type') || 'image/png' };
      } catch (e) {}
    }
    return out;
  }

  async function build(doc, update = false) {
    log(`${update ? 'Updating' : 'Building'} ${doc.pages.length} page(s)...`);
    toPlugin({ type: 'build', export: doc, images: await images(doc), options: { components: document.getElementById('components').checked, update } });
  }

  // Draws the export into the file; true when it was sent to the plugin. `render`: render the
  // design now (else read the last export, rendering one only when there is none).
  async function fromStudio(update, render = update || document.getElementById('refresh').checked) {
    const q = new URLSearchParams();
    const page = document.getElementById('page').value.trim();
    const bp = document.getElementById('bp').value.trim();
    if (page) q.set('page', page);
    if (bp) q.set('bp', bp);
    log('Rendering the dfw design in the Studio...');
    try {
      // A GET reads the last export; rendering is a POST. No export yet: render one.
      let r = render ? null : await fetch('/__dfw/penpot/export.json');
      if (!r || r.status === 404) r = await post(`/__dfw/penpot/export.json?${q}`, '{}');
      const doc = await r.json();
      if (!r.ok) throw new Error(doc.error || r.statusText);
      await build(doc, update);
      if (update) document.getElementById('stale').hidden = true;
      return true;
    } catch (e) {
      log(`Could not get the export: ${e.message}. Is the dfw Studio running? Or use "Load export file".`, true);
      return false;
    }
  }
  document.getElementById('build').addEventListener('click', () => fromStudio(false));
  // Redraws the boards already in this file in place (comment threads stay); edits not sent to dfw yet are lost.
  document.getElementById('update').addEventListener('click', () => fromStudio(true));

  // Live comments: ask the plugin for the threads, send them to the Studio, post dfw's replies back.
  const liveStatus = (t) => (document.getElementById('liveStatus').textContent = t);
  let posted = [];
  let busyAt = 0;
  // The automatic board update: send the designer's pending changes, then redraw the boards in
  // place. `stage` is 'collect' or 'build' while one runs; a failure waits a minute.
  let update = { busyAt: 0, failedAt: 0, stage: null, render: false };
  const isLive = () => document.getElementById('live').checked;
  async function tick() {
    if (needSession && !(await loadSession())) return liveStatus('The dfw Studio is not reachable: start it with "dfw studio start"; this panel reconnects by itself.');
    if (!bridge) return;
    if (!isLive() && !autoBox.checked) return liveStatus('Live comments are off: use "Send changes to dfw".');
    if (update.busyAt && Date.now() - update.busyAt < dfwPanel.BUSY_MS) return;
    if (busyAt && Date.now() - busyAt < 30000) return;
    busyAt = Date.now();
    toPlugin({ type: 'threads' });
  }
  async function sync(data) {
    try {
      // With live comments off the threads stay in Penpot; the answer still says whether the boards are behind.
      const threads = isLive() ? data.threads : [];
      const r = await post('/__dfw/penpot/sync', JSON.stringify({ ...data, threads, posted: isLive() ? posted : [] }));
      const res = await r.json();
      if (!r.ok) throw new Error(res.error || r.statusText);
      posted = [];
      const built = Boolean(data.exportId);
      document.getElementById('stale').hidden = !res.stale || (autoBox.checked && built);
      say('agent', res.listening ? 'The agent is listening: your comments and sent changes reach it at once.' : 'The agent is not listening: your comments are kept; ask it to look at the review comments.');
      if (isLive()) {
        const news = [res.comments.length ? `${res.comments.length} new (${res.comments.join(', ')})` : '', res.updated.map((u) => `${u.id} ${u.status}`).join(', ')].filter(Boolean).join('; ');
        liveStatus(`Live: ${threads.length} thread(s) on dfw boards, checked ${new Date().toLocaleTimeString()}${news ? `. ${news}` : ''}`);
      } else liveStatus('Live comments are off: use "Send changes to dfw".');
      if (autoBox.checked && !built) say('autoStatus', 'Press "Build boards" once in this file; after that the boards stay up to date.');
      const now = Date.now();
      const due = dfwPanel.shouldAutoUpdate({
        auto: autoBox.checked,
        built,
        stale: Boolean(res.stale),
        boardsExportId: data.exportId,
        latestExportId: res.exportId,
        quietMs: res.quietMs,
        busyMs: update.busyAt ? now - update.busyAt : 0,
        sinceFailMs: update.failedAt ? now - update.failedAt : null,
      });
      if (due) startUpdate(Boolean(res.stale));
      if (isLive() && res.replies.length) return toPlugin({ type: 'reply', replies: res.replies });
    } catch (e) {
      liveStatus(`Live comments paused: ${e.message}. Is the dfw Studio running, and were the boards built from it?`);
    }
    busyAt = 0;
  }
  function startUpdate(render) {
    update = { busyAt: Date.now(), failedAt: 0, stage: 'collect', render };
    say('autoStatus', 'The dfw design changed: sending your changes to dfw, then updating the boards...');
    toPlugin({ type: 'collect' });
  }
  function updateFailed(why) {
    update = { busyAt: 0, failedAt: Date.now(), stage: null, render: false };
    say('autoStatus', `Boards not updated: ${why} Your edits in Penpot are kept; trying again in a minute.`);
  }
  // Step 1: the designer's edits go to dfw first, so the redraw never loses them. Step 2: redraw.
  async function sendThenRedraw(changes) {
    try {
      const r = await post('/__dfw/penpot/changes', JSON.stringify(changes));
      const res = await r.json();
      if (!r.ok) throw new Error(res.error || r.statusText);
      if (res.changes) log(res.summary);
    } catch (e) {
      return updateFailed(`could not send your changes (${e.message}).`);
    }
    update.stage = 'build';
    if (!(await fromStudio(true, update.render))) updateFailed('could not get the new export.');
  }
  setInterval(tick, 5000);
  tick();
  document.getElementById('load').addEventListener('click', () => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) await build(JSON.parse(await f.text()));
  });
  document.getElementById('send').addEventListener('click', () => {
    downloadOnly = false;
    log('Collecting changes...');
    toPlugin({ type: 'collect' });
  });
  document.getElementById('download').addEventListener('click', () => {
    downloadOnly = true;
    log('Collecting changes...');
    toPlugin({ type: 'collect' });
  });

  window.addEventListener('message', async (e) => {
    // Only Penpot (the parent window, which relays penpot.ui.sendMessage, on an allowed origin)
    // talks to this panel: a page that framed it is not Penpot.
    if (e.source !== parent || !bridge || !bridge.origins.includes(e.origin)) return;
    const msg = e.data || {};
    if (msg.type === 'error') {
      if (msg.of === 'threads' || msg.of === 'reply') {
        busyAt = 0;
        return liveStatus(`Live comments paused: ${msg.message}`);
      }
      if (update.stage && (msg.of === 'collect' || msg.of === 'build')) return updateFailed(`${msg.message}.`);
      return log(msg.message, true);
    }
    if (msg.type === 'changes' && update.stage === 'collect') return sendThenRedraw(msg.data);
    if (msg.type === 'built' && update.stage === 'build') {
      update = { busyAt: 0, failedAt: 0, stage: null, render: false };
      say('autoStatus', `Boards updated automatically at ${new Date().toLocaleTimeString()}.`);
    }
    if (msg.type === 'threads') return sync(msg.data);
    if (msg.type === 'replied') {
      posted = msg.done || [];
      busyAt = 0;
      return;
    }
    if (msg.type === 'built') {
      const s = msg.stats;
      return log(`Built ${s.pages} page(s), ${s.boards} board(s)${s.updated ? ` (${s.updated} updated in place)` : ''}, ${s.layers} layer(s), ${s.components} component(s), ${s.instances} instance(s), ${s.tokenLinks} token link(s).${s.warnings.length ? `\n\n${s.warnings.slice(0, 20).join('\n')}` : ''}`);
    }
    if (msg.type === 'changes') {
      const json = JSON.stringify(msg.data, null, 2);
      if (downloadOnly) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = `dfw-penpot-changes-${Date.now()}.json`;
        a.click();
        return log('Downloaded. Import it with: dfw penpot import <file>');
      }
      try {
        const r = await post('/__dfw/penpot/changes', json);
        const res = await r.json();
        if (!r.ok) throw new Error(res.error || r.statusText);
        log(res.summary);
      } catch (err) {
        log(`Could not send: ${err.message}. Use "Download changes" and run "dfw penpot import <file>".`, true);
      }
    }
  });
</script>
</body>
</html>
