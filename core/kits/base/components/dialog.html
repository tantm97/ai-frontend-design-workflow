<dfw-component name="dialog" group="Overlays" sizes="md sm lg" props="title"
  description="Modal dialog (shown open for design review). Body slot + actions slot (primary last).">
<style>
.dialog { position: relative; display: flex; flex-direction: column; width: var(--size-dialog); max-width: 100%; background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); color: var(--color-ink); }
.dialog--sm { width: var(--size-dialog-sm); }
.dialog--lg { width: var(--size-dialog-lg); }
.dialog__head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6) var(--space-2); }
.dialog__title { margin: 0; font: var(--font-weight-semibold) var(--font-size-lg) / var(--font-leading-snug) var(--font-family-display); letter-spacing: var(--font-tracking-tight); }
.dialog__body { padding: var(--space-2) var(--space-6) var(--space-5); font-size: var(--font-size-sm); color: var(--color-muted); }
.dialog__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-6); border-top: var(--border-width) solid var(--color-rule); }
</style>
<template>
<div class="dialog dialog--{{size}}" role="dialog" aria-modal="true" aria-label="{{title}}"><div class="dialog__head"><h2 class="dialog__title">{{title}}</h2></div><div class="dialog__body"><dfw-slot></dfw-slot></div><div class="dialog__foot"><dfw-slot name="actions"></dfw-slot></div></div>
</template>
<dfw-examples>
<dfw-use c="dialog" size="sm" title="Retire this item?">It will no longer be available to borrow. History is kept.<dfw-fill slot="actions"><dfw-use c="button" variant="secondary">Cancel</dfw-use><dfw-use c="button" variant="danger">Retire</dfw-use></dfw-fill></dfw-use>
</dfw-examples>
</dfw-component>
