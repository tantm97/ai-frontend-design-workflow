<dfw-component name="filter-chip" group="Inputs" variants="default active" props="label value"
  description="Compact filter trigger for toolbars: 'Label: value'. active = a non-default value is applied.">
<style>
.fchip { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--size-control-sm); padding: 0 var(--space-2) 0 var(--space-3); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-muted); font: var(--font-weight-regular) var(--font-size-xs) / 1 var(--font-family-body); white-space: nowrap; cursor: pointer; }
.fchip b { color: var(--color-ink); font-weight: var(--font-weight-medium); }
.fchip .icon { width: var(--size-icon-xs); height: var(--size-icon-xs); }
.fchip:hover { border-color: var(--color-border-strong); }
.fchip--active { border-color: var(--color-accent); background: var(--color-accent-soft); color: var(--color-accent-text); }
.fchip--active b { color: var(--color-accent-text); }
.fchip:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: var(--focus-offset); }
</style>
<template>
<button class="fchip fchip--{{variant}}" type="button" aria-haspopup="listbox">{{label}}: <b>{{value}}</b><dfw-icon name="chevron-down"></dfw-icon></button>
</template>
<dfw-examples>
<dfw-use c="filter-chip" label="Status" value="All"></dfw-use>
<dfw-use c="filter-chip" variant="active" label="Status" value="Overdue"></dfw-use>
</dfw-examples>
</dfw-component>
