<dfw-component name="field" group="Inputs" variants="default invalid" sizes="md lg" props="label hint error value placeholder type input-id icon mono"
  replaces="input textarea" description="Labelled text input with hint and error. Use variant=invalid with error text; never colour alone.">
<style>
.field { display: grid; gap: var(--space-1); min-width: 0; }
.field__label { font: var(--font-weight-medium) var(--font-size-sm) / var(--font-leading-snug) var(--font-family-body); color: var(--color-ink); }
.field__box { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-control); padding: 0 var(--space-3); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-muted); transition: border-color var(--duration-fast) var(--easing-out), box-shadow var(--duration-fast) var(--easing-out); }
.field__box:hover { border-color: var(--color-border-strong); }
.field__box:focus-within { border-color: var(--color-focus); box-shadow: 0 0 0 var(--focus-width) var(--color-focus-ring); }
.field__box .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); flex: none; }
.field__input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: var(--font-weight-regular) var(--font-size-sm) / 1.4 var(--font-family-body); color: var(--color-ink); padding: var(--space-2) 0; }
.field__input::placeholder { color: var(--color-subtle); }
.field--mono .field__input { font-family: var(--font-family-mono); letter-spacing: var(--font-tracking-wide); }
.field--lg .field__box { min-height: var(--size-control-lg); }
.field--lg .field__input { font-size: var(--font-size-md); }
.field__hint { font-size: var(--font-size-xs); color: var(--color-muted); }
.field__error { display: flex; gap: var(--space-1); align-items: center; font: var(--font-weight-medium) var(--font-size-xs) / var(--font-leading-snug) var(--font-family-body); color: var(--color-status-err-text); }
.field__error .icon { width: var(--size-icon-xs); height: var(--size-icon-xs); }
.field--invalid .field__box { border-color: var(--color-status-err); }
.field--invalid .field__box:focus-within { box-shadow: 0 0 0 var(--focus-width) var(--color-status-err-tint); }
</style>
<template>
<div class="field field--{{variant}} field--{{size}}"><label class="field__label" for="{{input-id}}">{{label}}</label><div class="field__box"><dfw-icon data-dfw-if="icon" name="{{icon}}"></dfw-icon><input class="field__input" id="{{input-id}}" type="text" value="{{value}}" placeholder="{{placeholder}}"></div><span class="field__hint" data-dfw-if="hint">{{hint}}</span><span class="field__error" data-dfw-if="error"><dfw-icon name="circle-alert"></dfw-icon>{{error}}</span></div>
</template>
<dfw-examples>
<dfw-use c="field" label="Asset ID" input-id="ex-f1" value="TP-TOOL-00422" hint="Generated from the category; editable"></dfw-use>
<dfw-use c="field" label="Search" input-id="ex-f2" icon="search" placeholder="Name, ID or scan"></dfw-use>
<dfw-use c="field" variant="invalid" label="Employee ID" input-id="ex-f3" value="2041" error="No employee 2041. Check the 5 digits."></dfw-use>
</dfw-examples>
</dfw-component>
