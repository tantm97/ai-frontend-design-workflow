name: validate
on:
  push:
    branches: [main]
  pull_request:
  # Pull requests opened by the upstream bot (GITHUB_TOKEN) do not fire pull_request:
  # scripts/ci-upstream.mjs starts this workflow on the bot branch instead.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Committed plugins match a clean build from the lock
        run: node scripts/build.mjs --check
      - name: Marketplace validation (structure, cross-references, no upstream hooks, conflict lint)
        run: node scripts/validate.mjs
  e2e:
    # Studio click-to-comment end to end (tests/e2e/studio.e2e.mjs). Playwright is a dev-only
    # driver installed outside the repo (DFW_RUNTIME_DIR, no repo dependency, no browser download):
    # it drives the runner's preinstalled Google Chrome.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Playwright library (pinned) and the runner's Chrome
        run: |
          echo "DFW_RUNTIME_DIR=$RUNNER_TEMP/dfw-runtime" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/dfw-runtime" --no-audit --no-fund --no-save "playwright@$PLAYWRIGHT_VERSION"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --version
          echo "DFW_BROWSER=$chrome" >> "$GITHUB_ENV"
      - name: End-to-end (Studio)
        run: node tests/e2e/studio.e2e.mjs --shots "$RUNNER_TEMP/e2e-shots"
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7
