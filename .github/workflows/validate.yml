name: validate
on:
  push:
    branches: [main]
  pull_request:
  # Pull requests opened by the upstream bot (GITHUB_TOKEN) do not fire pull_request:
  # scripts/ci-upstream.mjs starts this workflow on the bot branch instead.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Dev tools (Prettier, ESLint, TypeScript; pinned in package-lock.json)
        run: npm ci
      - name: Lint, format and type check (Studio browser code and its tests)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Committed plugins match a clean build from the lock
        run: node scripts/build.mjs --check
      - name: Marketplace validation (structure, cross-references, no upstream hooks, conflict lint)
        run: node scripts/validate.mjs
  native:
    # The binary (native/): formatting, build, Rust tests, lints, then the golden tests: the binary
    # against the results recorded in tests/golden. Windows builds and runs the Rust tests only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust toolchain (the exact version of native/rust-toolchain.toml, with clippy and rustfmt)
        working-directory: native
        run: |
          rustup toolchain install
          rustc --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Formatting
        working-directory: native
        run: cargo fmt --check
      - name: Build
        working-directory: native
        run: cargo build
      - name: Unit tests
        working-directory: native
        # About 2 minutes on every runner: a test that hangs (a lock that is never let go) fails
        # here instead of holding the job until its 30 minutes are up.
        timeout-minutes: 10
        # Every test binary runs, so one red run shows every failure of the platform.
        run: cargo test --no-fail-fast
      - name: Clippy (tests included)
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: runner.os != 'Windows'
        with:
          node-version: 22
      - name: Golden tests (the binary gives the recorded results)
        if: runner.os != 'Windows'
        # A missing binary fails instead of skipping: a green run means the cases ran.
        env:
          DFW_REQUIRE_BIN: '1'
        run: node --test tests/golden/
  e2e:
    # Studio click-to-comment end to end (tests/e2e/studio.e2e.mjs) against the binary. Playwright is a dev-only
    # driver installed outside the repo (DFW_RUNTIME_DIR, no repo dependency, no browser download):
    # it drives the runner's preinstalled Google Chrome.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Playwright library (pinned) and the runner's Chrome
        run: |
          echo "DFW_RUNTIME_DIR=$RUNNER_TEMP/dfw-runtime" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/dfw-runtime" --no-audit --no-fund --no-save "playwright@$PLAYWRIGHT_VERSION"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --version
          echo "DFW_BROWSER=$chrome" >> "$GITHUB_ENV"
      - name: The dfw binary the e2e drives (native/target/debug/dfw)
        working-directory: native
        run: |
          rustup toolchain install
          cargo build --locked
      - name: End-to-end (Studio)
        env:
          DFW_BIN: native/target/debug/dfw
        run: node tests/e2e/studio.e2e.mjs --shots "$RUNNER_TEMP/e2e-shots"
      # The tests that launch a browser are off in job native (no Chrome there); this runner has
      # one. One at a time: each starts its own headless Chrome.
      - name: Rust tests that need Chrome
        working-directory: native
        run: cargo test --locked -- --ignored --test-threads=1
      - name: Golden cases that render (Chrome)
        env:
          DFW_REQUIRE_BIN: '1'
          DFW_TEST_CHROME: '1'
        run: node --test --test-concurrency=1 tests/golden/
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7
