name: release-binaries
# Builds the native dfw binary (the Rust crate in native/) on each platform with cargo and
# publishes the binaries, with SHA256SUMS, as the GitHub release v<version>. Trigger: push a tag
# v<version> that matches native/Cargo.toml and the plugin manifest (or run it by hand to get
# artifacts without a release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Nothing is built or published unless the tagged commit is on main, the tests pass and the
  # committed plugins/ equal a clean build.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on origin/main; not releasing"; exit 1; }
      - name: Dev tools (esbuild for the Studio bundles, the unit tests' DOM; pinned in package-lock.json)
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Committed plugins match a clean build from the lock
        run: node scripts/build.mjs --check
      - name: Versions agree, marketplace valid
        run: node scripts/validate.mjs
      - name: Rust toolchain (pinned by native/rust-toolchain.toml)
        working-directory: native
        run: |
          rustup toolchain install
          rustc --version
      - name: Rust build and tests
        working-directory: native
        run: |
          cargo build --locked
          cargo test --locked
      - name: Golden tests (the binary against the recorded results)
        env:
          DFW_REQUIRE_BIN: '1'
        run: node --test tests/golden/

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Each runner builds its own target with its own toolchain: no cross-compilation.
        include:
          - { os: macos-15, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, platform: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, platform: win32-x64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -n 1)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != native/Cargo.toml version v$v"; exit 1; }
      - name: Rust toolchain (pinned by native/rust-toolchain.toml)
        working-directory: native
        run: |
          rustup toolchain install
          rustc -vV | grep -q "host: ${{ matrix.target }}" || { echo "this runner does not build ${{ matrix.target }} natively"; rustc -vV; exit 1; }
      # The collector address is compiled in from the repository secrets, on this step only (see
      # native/README-telemetry.md). No cache is shared with this build, and cargo runs without
      # -vv so the build script's environment is never printed.
      - name: Build the native binary
        working-directory: native
        env:
          DFW_OTLP_ENDPOINT: ${{ secrets.DFW_OTLP_ENDPOINT }}
          DFW_OTLP_HEADERS: ${{ secrets.DFW_OTLP_HEADERS }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the binary
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -n 1)
          ext=""; [ "${{ matrix.platform }}" = win32-x64 ] && ext=".exe"
          mkdir -p dist
          cp "native/target/${{ matrix.target }}/release/dfw$ext" "dist/dfw-$v-${{ matrix.platform }}$ext"
          ls -l dist
          echo "BIN=dist/dfw-$v-${{ matrix.platform }}$ext" >> "$GITHUB_ENV"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # Prints only whether an address and headers are compiled in, never the values; fails when
      # the binary and the secret disagree.
      - name: Telemetry address compiled in when the secret is set
        env:
          EXPECT_ENDPOINT: ${{ secrets.DFW_OTLP_ENDPOINT != '' }}
        run: |
          built=$("$BIN" __debug telemetry-build)
          echo "telemetry build: $built"
          echo "$built" | grep -q "\"endpoint\":$EXPECT_ENDPOINT" || { echo "the binary's address does not match the secret (expected endpoint: $EXPECT_ENDPOINT)"; exit 1; }
      - name: Smoke test (standalone, through the plugin launcher, and a real render)
        env:
          DFW_TELEMETRY: 'off'
        run: |
          export DFW_HOME="$RUNNER_TEMP/dfwhome"
          "$BIN" version | grep -q "^dfw $VERSION (native)"
          "$BIN" doctor || true
          name=dfw; [ "${{ matrix.platform }}" = win32-x64 ] && name=dfw.exe
          mkdir -p "$DFW_HOME/bin/$VERSION" && cp "$BIN" "$DFW_HOME/bin/$VERSION/$name"
          if [ "${{ matrix.platform }}" = win32-x64 ]; then
            cmd //c "plugins\\dfw\\bin\\dfw.cmd version" | grep -q "^dfw $VERSION (native)"
          else
            plugins/dfw/bin/dfw version | grep -q "^dfw $VERSION (native)"
          fi
          # A headless render. The linux-arm64 runner image ships no Chrome (the render path is
          # the same code as linux-x64, which runs it).
          [ "${{ matrix.platform }}" = linux-arm64 ] && exit 0
          mkdir -p "$RUNNER_TEMP/page"
          echo '<!doctype html><h1 style="font:40px sans-serif">dfw</h1>' > "$RUNNER_TEMP/page/t.html"
          case "${{ matrix.platform }}" in
            win32-*) url="file:///$(cygpath -m "$RUNNER_TEMP/page/t.html")" ;;
            *) url="file://$RUNNER_TEMP/page/t.html" ;;
          esac
          "$BIN" shoot --url "$url" --bp desktop --out "$RUNNER_TEMP/t.png"
          test -s "$RUNNER_TEMP/t.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dfw-${{ matrix.platform }}
          path: dist/dfw-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum dfw-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "dfw $GITHUB_REF_NAME" \
            --notes "Native dfw binaries (no Node.js needed). Install: curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh  (or, with Node: npx github:$GITHUB_REPOSITORY)"
