name: upstream-check
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # start validate.yml on the bot's pull requests (GITHUB_TOKEN pushes do not trigger it)
concurrency:
  group: upstream-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "dfw-upstream-bot"
          git config user.email "dfw-upstream-bot@users.noreply.github.com"
      - name: Propose updates (PR per skill; merging the PR is the approval)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-upstream.mjs
