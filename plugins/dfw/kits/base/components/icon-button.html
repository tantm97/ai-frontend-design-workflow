<dfw-component name="icon-button" group="Actions" variants="ghost secondary" sizes="md sm" props="icon label"
  description="Square button with an icon only. label is required (accessible name).">
<style>
.icon-btn { display: inline-grid; place-items: center; width: var(--size-control); height: var(--size-control); border: var(--border-width) solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--color-muted); cursor: pointer; transition: background-color var(--duration-fast) var(--easing-out), color var(--duration-fast) var(--easing-out); }
.icon-btn .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.icon-btn:hover { background: var(--color-surface-hover); color: var(--color-ink); }
.icon-btn--secondary { border-color: var(--color-border); background: var(--color-surface); }
.icon-btn--sm { width: var(--size-control-sm); height: var(--size-control-sm); }
.icon-btn:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: var(--focus-offset); }
.icon-btn:disabled { color: var(--color-subtle); cursor: not-allowed; background: transparent; }
</style>
<template>
<button class="icon-btn icon-btn--{{variant}} icon-btn--{{size}}" type="button" aria-label="{{label}}" title="{{label}}"><dfw-icon name="{{icon}}"></dfw-icon></button>
</template>
<dfw-examples>
<dfw-use c="icon-button" icon="x" label="Remove"></dfw-use>
<dfw-use c="icon-button" variant="secondary" icon="ellipsis" label="More"></dfw-use>
<dfw-use c="icon-button" size="sm" icon="x" label="Close"></dfw-use>
</dfw-examples>
</dfw-component>
