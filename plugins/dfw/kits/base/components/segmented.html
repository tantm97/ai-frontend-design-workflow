<dfw-component name="segmented" group="Inputs" sizes="md sm" props="label"
  description="Mutually exclusive options shown inline. Children: segment buttons (<button aria-pressed>). Optional data-tone ok|warn|err on a segment colours the pressed state.">
<style>
.seg { display: inline-flex; padding: var(--space-half); gap: var(--space-half); border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--border-width) solid var(--color-rule); }
.seg button { display: inline-flex; align-items: center; gap: var(--space-1); min-height: calc(var(--size-control) - var(--space-1)); padding: 0 var(--space-3); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-muted); font: var(--font-weight-medium) var(--font-size-sm) / 1 var(--font-family-body); white-space: nowrap; cursor: pointer; }
.seg button .icon { width: var(--size-icon-xs); height: var(--size-icon-xs); }
.seg button:hover { color: var(--color-ink); }
.seg button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-ink); box-shadow: var(--shadow-sm); }
.seg button[aria-pressed="true"][data-tone="ok"] { background: var(--color-status-ok); color: var(--color-on-fill); }
.seg button[aria-pressed="true"][data-tone="err"] { background: var(--color-status-err); color: var(--color-on-fill); }
.seg button[aria-pressed="true"][data-tone="warn"] { background: var(--color-status-warn); color: var(--color-on-warn); }
.seg button:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: 0; }
.seg--sm button { min-height: calc(var(--size-control-sm) - var(--space-1)); font-size: var(--font-size-xs); }
</style>
<template>
<div class="seg seg--{{size}}" role="group" aria-label="{{label}}"><dfw-slot></dfw-slot></div>
</template>
<dfw-examples>
<dfw-use c="segmented" label="View"><button type="button" aria-pressed="true">List</button><button type="button" aria-pressed="false">Board</button><button type="button" aria-pressed="false">Calendar</button></dfw-use>
<dfw-use c="segmented" label="Condition"><button type="button" aria-pressed="true" data-tone="ok"><dfw-icon name="check"></dfw-icon>Good</button><button type="button" aria-pressed="false" data-tone="err">Damaged</button><button type="button" aria-pressed="false" data-tone="warn">Missing parts</button></dfw-use>
</dfw-examples>
</dfw-component>
