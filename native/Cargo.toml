[package]
name = "dfw"
version = "0.5.1"
edition = "2021"
description = "dfw: design-first frontend workflow CLI (native core)"
license = "MIT"
publish = false

[[bin]]
name = "dfw"
path = "src/main.rs"

# Every crate of design decision 3 is declared now so module groups can be ported in parallel
# without editing this file. Keep the table in openspec design.md and this list the same.
[dependencies]
brotli-decompressor = "6.3.2"
flate2 = "1.1.11"
include_dir = "0.7.4"
png = "0.18.1"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

# Declared ahead of their first use (see above). Remove this table when the port is complete,
# so a dependency nothing uses is reported again.
[lints.cargo]
unused_dependencies = "allow"

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
strip = true
