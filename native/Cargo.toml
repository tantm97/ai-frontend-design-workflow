[package]
name = "dfw"
version = "0.6.5"
edition = "2021"
description = "dfw: design-first frontend workflow CLI (native core)"
license = "MIT"
publish = false

[[bin]]
name = "dfw"
path = "src/main.rs"

# The crates of rust-core design decision 3 (keep that table and this list the same).
[dependencies]
brotli-decompressor = "6.3.2"
flate2 = "1.1.11"
include_dir = "0.7.4"
png = "0.18.1"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tungstenite = "0.30.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

# Local HTTP servers in tests (the download and the DevTools fakes); the Studio has its own
# HTTP layer (src/studio/http.rs).
[dev-dependencies]
tiny_http = "0.12.0"

# docs/conventions/rust.md: no unsafe, no unwrap/expect/panic outside tests (clippy.toml allows
# them in tests), long functions reported (threshold in clippy.toml).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
too_many_lines = "warn"
allow_attributes_without_reason = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
strip = true
